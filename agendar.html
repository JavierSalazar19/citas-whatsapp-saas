<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar Cita</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 id="negocio-nombre">Cargando consultorio...</h1>
      <p class="subtitle">Selecciona el servicio, fecha y horario disponible. Te confirmaremos por WhatsApp.</p>

      <form id="form-agendar">
        <div class="form-group">
          <label for="servicio">1. Elige el servicio</label>
          <select id="servicio" required></select>
        </div>

        <div class="form-group">
          <label for="fecha">2. Elige la fecha</label>
          <input type="date" id="fecha" required />
        </div>

        <div class="form-group">
          <label>3. Horarios disponibles</label>
          <div id="slots-container" class="slots-grid">
            <p class="subtitle">Selecciona una fecha para ver horarios.</p>
          </div>
          <input type="hidden" id="hora-seleccionada" required />
        </div>

        <div class="form-group">
          <label for="nombre">4. Tu nombre completo</label>
          <input type="text" id="nombre" placeholder="Ej. María López" required />
        </div>

        <div class="form-group">
          <label for="telefono">5. Tu WhatsApp (10 dígitos)</label>
          <input type="tel" id="telefono" placeholder="Ej. 6441234567" maxlength="10" required />
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">Confirmar Cita</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/disponibilidad.js"></script>
  <script src="js/agendar.js"></script>
</body>
</html>
